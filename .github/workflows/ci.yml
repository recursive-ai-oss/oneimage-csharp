name: ci

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64 }
          - { os: macos-latest, rid: osx-arm64 }
    runs-on: ${{ matrix.os }}
    env:
      ONEIMAGE_ARTIFACTS: ${{ runner.temp }}/artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build -c Release
      - name: Test
        run: dotnet test -c Release --no-build
      - name: Publish AOT smoke app (warnings are errors)
        run: dotnet publish tests/OneImage.AotSmoke -c Release -r ${{ matrix.rid }} -o ${{ runner.temp }}/smoke -warnaserror
      - name: Run AOT smoke app
        shell: bash
        run: ${{ runner.temp }}/smoke/OneImage.AotSmoke
