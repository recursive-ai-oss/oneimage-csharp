name: ci

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64 }
          - { os: macos-latest, rid: osx-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Build output goes outside the checkout, as it does locally; the runner context is only available inside steps.
      - name: Artifacts directory
        shell: bash
        run: echo "ONEIMAGE_ARTIFACTS=$RUNNER_TEMP/artifacts" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build -c Release
      - name: Test
        run: dotnet test -c Release --no-build
      - name: Publish AOT smoke app (warnings are errors)
        run: dotnet publish tests/OneImage.AotSmoke -c Release -r ${{ matrix.rid }} -o ${{ runner.temp }}/smoke -warnaserror
      - name: Run AOT smoke app
        shell: bash
        # Quoted environment variable (inside the YAML quotes, for the shell): on Windows the inlined path would lose its backslashes in bash.
        run: '"$RUNNER_TEMP/smoke/OneImage.AotSmoke"'
      - name: Publish web AOT smoke app (warnings are errors)
        run: dotnet publish tests/OneImage.Web.AotSmoke -c Release -r ${{ matrix.rid }} -o ${{ runner.temp }}/websmoke -warnaserror
      - name: Run web AOT smoke app
        shell: bash
        run: '"$RUNNER_TEMP/websmoke/OneImage.Web.AotSmoke"'

  # Runs the libraries on the Mono WebAssembly runtime in a real browser, trimmed (Release) and untrimmed on the interpreter (Debug).
  # No wasm-tools workload is needed: neither build relinks the native runtime.
  wasm:
    name: WebAssembly browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Artifacts directory
        run: echo "ONEIMAGE_ARTIFACTS=$RUNNER_TEMP/artifacts" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish the browser-wasm smoke app (trim warnings are errors)
        run: dotnet publish tests/OneImage.WasmSmoke -c Release -o "${{ runner.temp }}/wasm" -warnaserror
      - name: Run the Release build in headless Chrome
        run: node tests/OneImage.WasmSmoke/run-browser.mjs "${{ runner.temp }}/wasm/wwwroot"
      - name: Publish the Debug build
        run: dotnet publish tests/OneImage.WasmSmoke -c Debug -o "${{ runner.temp }}/wasm-debug"
      - name: Run the Debug build in headless Chrome
        run: node tests/OneImage.WasmSmoke/run-browser.mjs "${{ runner.temp }}/wasm-debug/wwwroot"
