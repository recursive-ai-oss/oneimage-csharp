<!doctype html>
<meta charset="utf-8">
<body>
<script type="module">
// Draws page 1 of ?f=<pdf url> at ?dpi=<n> with pdf.js and posts the PNG (or the error text) back to the server that serves this page.
const q = new URLSearchParams(location.search);
const id = q.get('id');
async function send(kind, body) {
  await fetch('/result?id=' + encodeURIComponent(id) + '&kind=' + kind, { method: 'POST', body });
}
try {
  const pdfjsLib = await import('./node_modules/pdfjs-dist/build/pdf.mjs');
  pdfjsLib.GlobalWorkerOptions.workerSrc = './node_modules/pdfjs-dist/build/pdf.worker.mjs';
  const dpi = parseFloat(q.get('dpi') || '150');
  const doc = await pdfjsLib.getDocument({
    url: q.get('f'),
    password: q.get('pw') || undefined,
    cMapUrl: './node_modules/pdfjs-dist/cmaps/', cMapPacked: true,
    standardFontDataUrl: './node_modules/pdfjs-dist/standard_fonts/',
    isEvalSupported: false,
  }).promise;
  const page = await doc.getPage(1);
  const viewport = page.getViewport({ scale: dpi / 72 });
  const canvas = document.createElement('canvas');
  canvas.width = Math.ceil(viewport.width);
  canvas.height = Math.ceil(viewport.height);
  await page.render({ canvasContext: canvas.getContext('2d'), viewport, background: 'white' }).promise;
  const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
  await send('png', blob);
} catch (e) {
  await send('error', String(e));
}
</script>
