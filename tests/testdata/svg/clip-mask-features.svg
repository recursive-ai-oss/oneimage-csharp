<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 200 200" clip-path="url(#page)">
  <defs>
    <path id="star" d="M 100 15 l 50 160 l -130 -100 l 160 0 l -130 100 z"/>
    <clipPath id="page"><rect x="4" y="4" width="192" height="192" rx="20"/></clipPath>
    <clipPath id="evenodd" transform="translate(-10 0)"><use xlink:href="#star" clip-rule="evenodd"/></clipPath>
    <clipPath id="box" clipPathUnits="objectBoundingBox" clip-path="url(#page)"><circle cx="0.5" cy="0.5" r="0.45" clip-path="url(#evenodd)"/><rect width="0.2" height="0.2"/></clipPath>
    <mask id="lum"><rect width="200" height="200" fill="#404040"/><circle cx="100" cy="100" r="60" fill="white"/></mask>
    <mask id="alpha" mask-type="alpha" maskContentUnits="objectBoundingBox" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="200"><circle cx="0.5" cy="0.5" r="0.5" fill-opacity="0.7"/></mask>
    <mask id="chain" mask="url(#alpha)" x="-0.5" y="-0.5" width="2" height="2"><rect width="200" height="200" fill="white" mask="url(#lum)"/></mask>
  </defs>
  <g clip-path="url(#box)" mask="url(#chain)" opacity="0.9" transform="rotate(10 100 100)">
    <rect width="200" height="200" fill="#3a7"/>
    <rect x="20" y="20" width="90" height="90" fill="#a33" mask="url(#lum)"/>
  </g>
  <svg x="120" y="120" width="60" height="60" overflow="inherit"><circle cx="30" cy="30" r="50" fill="#33a" clip-path="url(#evenodd)"/></svg>
</svg>
